name: React CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Build Docker Image
        run: |
          docker build -t lokesh0125/sre-react-app:latest \
                       -t lokesh0125/sre-react-app:${{github.sha}} .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: |
          docker push lokesh0125/sre-react-app:latest
          docker push lokesh0125/sre-react-app:${{github.sha}}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull lokesh0125/sre-react-app:latest
            sudo docker stop react-app || true
            sudo docker rm react-app || true
            sudo docker run -d --name react-app -p 80:80 lokesh0125/sre-react-app:latest
